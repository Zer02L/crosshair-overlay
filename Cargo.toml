[package]
name = "crosshair-overlay"
version = "0.1.0"
edition = "2021"
authors = ["Crosshair X Alternative"]
description = "High-performance, lightweight, cross-platform crosshair overlay"

[dependencies]
# Оконная подсистема (кроссплатформенная, поддержка сквозных кликов и прозрачности)
winit = "0.30"

# Легковесный программный/аппаратный вывод буфера в окно
softbuffer = "0.4"

# Нативный Wayland Layer-Shell для оверлеев поверх полноэкранных игр с настоящей прозрачностью
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Векторный 2D-рендеринг со сглаживанием субпикселей (антиалиасинг)
tiny-skia = "0.11"

# Сериализация конфигурации прицелов и пресетов
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }

# Оптимизации разработки (ускоряет сборку в 3-4 раза)
[profile.dev]
debug = 1 # Облегченные таблицы строк вместо полного DWARF (меньше вес и быстрее линковка)

# Внешние библиотеки компилируются с оптимизацией один раз и работают быстро
[profile.dev.package."*"]
opt-level = 3

# Максимально сжатый и оптимизированный релизный бинарник для пользователей
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
