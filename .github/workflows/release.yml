name: Build and Release Crosshair Overlay

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp target/release/crosshair-overlay dist/crosshair-overlay-linux-x86_64
          cp crosshair_config.json dist/crosshair_config.json 2>/dev/null || true
          tar -czvf crosshair-overlay-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosshair-overlay-linux-x86_64
          path: crosshair-overlay-linux-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [ build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crosshair-overlay-linux-x86_64/*.tar.gz
          generate_release_notes: true
